# Tests and builds Exit Demo Mode for Linux on every push and pull request.
# Creating a release with a new tag like v1.1.0 also attaches the Linux app, main.py and their SHA-256 to it.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    # Built on an older Ubuntu so the app also runs on older distributions (glibc).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install mido python-rtmidi pyinstaller==6.11.1

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build the Linux app
        run: |
          python -m PyInstaller --onefile --windowed --name exit-demo-mode \
            --hidden-import mido.backends.rtmidi --collect-binaries rtmidi main.py
          tar -czf dist/exit-demo-mode-linux-x86_64.tar.gz -C dist exit-demo-mode
          cp main.py dist/main.py

      - name: Compute SHA-256
        run: |
          cd dist
          sha256sum exit-demo-mode-linux-x86_64.tar.gz main.py | tee SHA256.txt

      - uses: actions/upload-artifact@v5
        with:
          name: Exit-Demo-Mode-Linux
          path: |
            dist/exit-demo-mode-linux-x86_64.tar.gz
            dist/main.py
            dist/SHA256.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/exit-demo-mode-linux-x86_64.tar.gz
            dist/main.py
            dist/SHA256.txt
          generate_release_notes: true
